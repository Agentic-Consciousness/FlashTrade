name: Verify

# The project's test suite. Nothing deploys and no secrets are used.
# This repository is public, and pull_request runs the workflow from the pull
# request. A self-hosted runner here would let an outsider execute that code on
# the owner's machine, so every event — including ones only maintainers can
# fire — stays on a GitHub-hosted runner.
# The suite still runs only when PERSONAL_GITHUB_CI_ENABLED is 'true', and
# pull requests still have to come from this repository.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    if: ${{ vars.PERSONAL_GITHUB_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Verify
    runs-on: ubuntu-latest
    container:
      image: python:3.12-bookworm
      options: --init --cpus 2 --memory 4g
    timeout-minutes: 30
    steps:
      - name: Install git
        # checkout and verify.sh call git. The bookworm image ships it via
        # buildpack-deps; install it when the image does not.
        run: |
          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends git
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace
        # The job container's user differs from the checkout's owner, so git refuses to read it otherwise.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run the checks
        run: bash .github/scripts/verify.sh
